<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちいかわ性格診断 · 你是哪个小可爱？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --pink: oklch(72% 0.18 355);
  --pink-light: oklch(88% 0.08 355);
  --pink-pale: oklch(95% 0.04 355);
  --cream: oklch(97% 0.015 85);
  --cream-2: oklch(93% 0.02 85);
  --cream-3: oklch(88% 0.025 85);
  --ink: oklch(22% 0.012 50);
  --ink-light: oklch(40% 0.01 50);
  --ink-lighter: oklch(55% 0.008 50);
  --radius: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --shadow: 0 4px 20px oklch(22% 0.012 50 / 0.06);
  --shadow-lg: 0 12px 40px oklch(22% 0.012 50 / 0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; scroll-behavior: smooth; }
body {
  overflow-x: clip;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--cream);
  min-height: 100dvh;
}
body::before {
  content: ""; position: fixed; top: -200px; right: -150px; width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(95% 0.04 355 / 0.6), transparent);
  pointer-events: none; z-index: 0;
}
body::after {
  content: ""; position: fixed; bottom: -120px; left: -100px; width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(94% 0.06 90 / 0.4), transparent);
  pointer-events: none; z-index: 0;
}
header {
  position: relative; z-index: 10;
  padding: 14px 24px; max-width: 820px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
}
.wordmark {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.2rem;
  color: var(--ink); letter-spacing: -0.03em; text-decoration: none;
}
.wordmark span { color: var(--pink); }
header nav a {
  font-size: 0.85rem; font-weight: 500; color: var(--ink-light); text-decoration: none;
}
header nav a:hover { color: var(--pink); }
main {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 24px 40px;
}
.quiz-container {
  width: 100%; max-width: 660px;
  background: white; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 36px 32px 28px; min-height: 400px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.progress-bar { flex: 1; height: 6px; background: var(--cream-2); border-radius: 999px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink), oklch(78% 0.16 20));
  border-radius: 999px; transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.progress-label {
  font-size: 0.75rem; font-weight: 600; color: var(--ink-lighter);
  white-space: nowrap; font-family: 'Plus Jakarta Sans', sans-serif;
}
.screen { display: none; }
.screen.active { display: block; }

/* INTRO */
#screen-intro { text-align: center; padding: 20px 0; }
#screen-intro .char-row {
  display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
}
#screen-intro .char-row .mini-avatar {
  width: 70px; height: 70px; border-radius: 50%; overflow: hidden;
  background: var(--cream-2);
  animation: float 3s ease-in-out infinite;
}
#screen-intro .char-row .mini-avatar:nth-child(2) { animation-delay: 0.5s; }
#screen-intro .char-row .mini-avatar:nth-child(3) { animation-delay: 1s; }
#screen-intro .char-row .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
#screen-intro h1 {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
  font-size: 2rem; margin-bottom: 8px; letter-spacing: -0.03em;
}
#screen-intro h1 span { color: var(--pink); }
#screen-intro .sub {
  color: var(--ink-light); font-size: 0.95rem; margin-bottom: 6px; line-height: 1.7;
}
#screen-intro .sub2 {
  color: var(--ink-lighter); font-size: 0.85rem; margin-bottom: 24px;
}
.btn {
  padding: 14px 36px; border-radius: var(--radius-pill);
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
  font-size: 0.95rem; border: none; cursor: pointer;
  transition: all 0.2s ease; text-decoration: none; display: inline-block;
}
.btn-primary { background: var(--pink); color: white; }
.btn-primary:hover { background: oklch(65% 0.2 355); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--cream-2); color: var(--ink-light); }
.btn-secondary:hover { background: var(--cream-3); }

/* QUESTION */
.q-number {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.75rem; font-weight: 700;
  color: var(--pink); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px;
}
.q-text {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
  font-size: 1.2rem; line-height: 1.4; margin-bottom: 22px; color: var(--ink); letter-spacing: -0.02em;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; border-radius: var(--radius-sm);
  border: 2px solid var(--cream-3); cursor: pointer;
  transition: all 0.2s ease; font-size: 0.92rem; color: var(--ink-light); line-height: 1.5;
}
.option:hover { border-color: var(--pink-light); background: var(--pink-pale); }
.option.selected {
  border-color: var(--pink); background: oklch(95% 0.04 355 / 0.5);
  color: var(--ink); font-weight: 500;
}
.option .radio {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--cream-3);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.option.selected .radio { border-color: var(--pink); background: var(--pink); }
.option.selected .radio::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: white; }
.btn-row { display: flex; gap: 10px; margin-top: 22px; justify-content: space-between; }
.btn-row .btn { padding: 10px 24px; font-size: 0.85rem; }
.btn-back { visibility: hidden; }
.btn-back.show { visibility: visible; }
.question-progress-text {
  text-align: center; font-size: 0.8rem; color: var(--ink-lighter); margin-top: 16px;
}

/* RESULT */
#screen-result { padding: 10px 0; }
.result-header { text-align: center; margin-bottom: 28px; }
.result-badge {
  display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 4px 12px; border-radius: var(--radius-pill);
  background: var(--pink-pale); color: var(--pink); margin-bottom: 8px;
}
.result-header h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.6rem; }

/* TOP 1 */
.top1-wrap {
  display: flex; flex-wrap: wrap; gap: 24px; align-items: center;
  background: oklch(96% 0.03 80 / 0.5); border-radius: var(--radius); padding: 20px 24px;
  margin-bottom: 20px;
}
.top1-avatar {
  flex-shrink: 0; width: 110px; height: 110px; border-radius: 50%; overflow: hidden;
  background: var(--cream-2); box-shadow: 0 4px 20px oklch(22% 0.012 50 / 0.08);
}
.top1-avatar img { width: 100%; height: 100%; object-fit: cover; }
.top1-info { flex: 1; min-width: 200px; }
.top1-info .rank-label {
  display: inline-block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 2px 10px; border-radius: var(--radius-pill);
  background: var(--pink); color: white; margin-bottom: 6px;
}
.top1-info h3 {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.4rem;
  margin-bottom: 2px;
}
.top1-info .jp-name { font-size: 0.85rem; color: var(--ink-lighter); margin-bottom: 4px; }
.top1-info .match-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}
.top1-info .match-bar .bar-track {
  flex: 1; height: 8px; background: var(--cream-2); border-radius: 999px; overflow: hidden;
}
.top1-info .match-bar .bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--pink), oklch(78% 0.16 20));
  border-radius: 999px; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
}
.top1-info .match-bar .pct { font-weight: 700; font-size: 0.9rem; color: var(--pink); min-width: 38px; }
.top1-info .type-tag {
  font-size: 0.8rem; font-weight: 600; color: var(--pink); margin-bottom: 8px;
}
.top1-info .desc {
  font-size: 0.88rem; color: var(--ink-light); line-height: 1.7;
}
.top1-info .traits {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
}
.top1-info .traits span {
  font-size: 0.75rem; font-weight: 500; padding: 2px 10px;
  border-radius: var(--radius-pill); background: var(--cream-2); color: var(--ink-light);
}
.top1-percent-badge {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
  font-size: 2rem; color: var(--pink); flex-shrink: 0;
}

/* TOP 2 & 3 */
.top2-3 {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;
}
.top-card {
  border: 2px solid var(--cream-3); border-radius: var(--radius-sm);
  overflow: hidden; transition: all 0.2s ease; cursor: pointer;
}
.top-card:hover { border-color: var(--pink-light); }
.top-card-header {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; background: white;
}
.top-card-header .rank-badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; color: white; flex-shrink: 0;
}
.top-card-header .rank-badge.r2 { background: oklch(70% 0.10 220); }
.top-card-header .rank-badge.r3 { background: oklch(70% 0.10 80); }
.top-card-header .mini-avatar {
  width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
  background: var(--cream-2); flex-shrink: 0;
}
.top-card-header .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
.top-card-header .card-name {
  flex: 1; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1rem;
}
.top-card-header .card-pct {
  font-weight: 700; font-size: 0.9rem; color: var(--ink-lighter); flex-shrink: 0;
}
.top-card-header .expand-icon {
  font-size: 0.8rem; color: var(--ink-lighter); transition: transform 0.2s ease; flex-shrink: 0;
}
.top-card.open .expand-icon { transform: rotate(180deg); }
.top-card-detail {
  max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  background: var(--cream-2);
}
.top-card.open .top-card-detail { max-height: 400px; }
.top-card-detail-inner { padding: 0 16px 16px 58px; }
.top-card-detail-inner .type-tag {
  font-size: 0.75rem; font-weight: 600; color: var(--pink); margin-bottom: 4px;
}
.top-card-detail-inner p {
  font-size: 0.85rem; color: var(--ink-light); line-height: 1.7; margin-bottom: 8px;
}
.top-card-detail-inner .traits {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.top-card-detail-inner .traits span {
  font-size: 0.7rem; font-weight: 500; padding: 2px 8px;
  border-radius: var(--radius-pill); background: white; color: var(--ink-light);
}
.restart-row { text-align: center; margin-top: 16px; }

/* ===== CHARACTER CARD GRID ===== */
.char-section {
  position: relative; z-index: 1;
  width: 100%; max-width: 900px;
  margin: 32px auto 0;
  padding: 0 24px 40px;
}
.char-section .section-head {
  text-align: center; margin-bottom: 28px;
}
.char-section .section-head h2 {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
  font-size: 1.4rem; letter-spacing: -0.03em; margin-bottom: 4px;
}
.char-section .section-head p {
  font-size: 0.85rem; color: var(--ink-lighter);
}
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  gap: 16px;
}
.char-detail-card {
  background: white; border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; transition: all 0.3s ease;
  border: 2px solid transparent;
}
.char-detail-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.char-detail-card.open { border-color: var(--pink); }
.char-detail-card .card-collapsed {
  display: flex; align-items: center; gap: 14px;
  padding: 16px;
}
.char-detail-card .card-avatar {
  width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
  background: var(--cream-2); flex-shrink: 0;
  box-shadow: 0 2px 8px oklch(22% 0.012 50 / 0.08);
}
.char-detail-card .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
.char-detail-card .card-main { flex: 1; min-width: 0; }
.char-detail-card .card-name {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
  font-size: 1.05rem; letter-spacing: -0.02em; line-height: 1.2;
}
.char-detail-card .card-name-jp {
  font-size: 0.75rem; color: var(--ink-lighter); margin-top: 1px;
}
.char-detail-card .card-mbti {
  display: inline-block; font-size: 0.68rem; font-weight: 700;
  padding: 2px 10px; border-radius: var(--radius-pill);
  background: var(--pink-pale); color: var(--pink);
  letter-spacing: 0.04em; margin-top: 4px;
}
.char-detail-card .card-expand-icon {
  font-size: 0.75rem; color: var(--ink-lighter);
  transition: transform 0.3s ease; flex-shrink: 0;
}
.char-detail-card.open .card-expand-icon { transform: rotate(180deg); }
.char-detail-card .card-expanded {
  max-height: 0; overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.char-detail-card.open .card-expanded { max-height: 600px; }
.char-detail-card .card-expanded-inner {
  padding: 0 16px 16px 86px;
}
.char-detail-card .card-expanded-inner .card-desc {
  font-size: 0.85rem; color: var(--ink-light); line-height: 1.7;
  margin-bottom: 12px;
}
.char-detail-card .card-expanded-inner .info-rows {
  display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px;
}
.char-detail-card .card-expanded-inner .info-row {
  display: flex; gap: 8px; font-size: 0.8rem;
}
.char-detail-card .card-expanded-inner .info-row .info-label {
  font-weight: 600; color: var(--ink); min-width: 52px; flex-shrink: 0;
}
.char-detail-card .card-expanded-inner .info-row .info-value {
  color: var(--ink-light);
}
.char-detail-card .card-expanded-inner .voice-box {
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: oklch(95% 0.04 355 / 0.5); font-size: 0.8rem;
  font-weight: 600; color: var(--pink); text-align: center; margin-bottom: 10px;
}
.char-detail-card .card-expanded-inner .card-traits {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.char-detail-card .card-expanded-inner .card-traits span {
  font-size: 0.72rem; font-weight: 500; padding: 2px 8px;
  border-radius: var(--radius-pill); background: var(--cream-2); color: var(--ink-light);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  header { padding: 10px 18px; }
  .wordmark { font-size: 1.05rem; }
  header nav a { font-size: 0.8rem; padding: 5px 12px; border-radius: var(--radius-pill); }

  main { padding: 16px 14px 30px; }
  .quiz-container { padding: 24px 18px 22px; border-radius: var(--radius-sm); }

  #screen-intro h1 { font-size: 1.5rem; }
  #screen-intro .sub { font-size: 0.88rem; }
  #screen-intro .sub2 { font-size: 0.8rem; }
  #screen-intro .char-row .mini-avatar { width: 56px; height: 56px; }

  .q-text { font-size: 1.08rem; }
  .option { padding: 12px 14px; font-size: 0.9rem; }
  .btn { padding: 12px 28px; font-size: 0.9rem; }
  .btn-row { flex-wrap: wrap; gap: 8px; }
  .btn-row .btn { flex: 1; min-width: 100px; text-align: center; }

  /* result */
  .top1-wrap { flex-direction: column; text-align: center; padding: 16px; gap: 14px; }
  .top1-avatar { width: 90px; height: 90px; margin: 0 auto; }
  .top1-info { min-width: 0; }
  .top1-info .traits { justify-content: center; }
  .top1-percent-badge { font-size: 1.5rem; }

  /* character section */
  .char-section { padding: 0 14px 36px; margin-top: 24px; }
  .char-section .section-head h2 { font-size: 1.2rem; }
  .char-section .section-head p { font-size: 0.8rem; }

  .char-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
  .char-detail-card .card-collapsed { padding: 12px; gap: 10px; }
  .char-detail-card .card-avatar { width: 48px; height: 48px; }
  .char-detail-card .card-name { font-size: 0.95rem; }
  .char-detail-card .card-mbti { font-size: 0.65rem; }
  .char-detail-card .card-expanded-inner { padding: 0 14px 14px; }
  .char-detail-card .card-expanded-inner .card-desc { font-size: 0.82rem; }
  .char-detail-card .card-expanded-inner .info-row { font-size: 0.78rem; }
  .char-detail-card .card-expanded-inner .info-row .info-label { min-width: 46px; }
  .char-detail-card .card-expanded-inner .voice-box { font-size: 0.78rem; }
  .char-detail-card .card-expanded-inner .card-traits span { font-size: 0.7rem; }
}

@media (max-width: 480px) {
  body { font-size: 15px; }
  main { padding: 12px 10px 24px; }
  .quiz-container { padding: 18px 14px 18px; border-radius: 12px; }

  #screen-intro h1 { font-size: 1.3rem; }
  #screen-intro .sub { font-size: 0.82rem; }
  #screen-intro .sub br { display: none; }
  #screen-intro .sub2 { font-size: 0.75rem; }
  #screen-intro .char-row { gap: 12px; }
  #screen-intro .char-row .mini-avatar { width: 50px; height: 50px; }

  .progress-wrap { margin-bottom: 18px; }
  .progress-bar { height: 5px; }
  .progress-label { font-size: 0.7rem; }
  .q-number { font-size: 0.7rem; }
  .q-text { font-size: 1rem; margin-bottom: 16px; }
  .option { padding: 10px 12px; font-size: 0.85rem; gap: 10px; }
  .option .radio { width: 18px; height: 18px; }
  .btn { padding: 10px 22px; font-size: 0.85rem; }

  .top1-wrap { gap: 10px; padding: 14px; }
  .top1-avatar { width: 80px; height: 80px; }
  .top1-info h3 { font-size: 1.2rem; }
  .top1-info .desc { font-size: 0.82rem; }
  .top1-info .traits span { font-size: 0.7rem; }

  .top-card-header { padding: 10px 12px; gap: 10px; }
  .top-card-header .mini-avatar { width: 36px; height: 36px; }
  .top-card-header .card-name { font-size: 0.9rem; }
  .top-card-header .card-pct { font-size: 0.8rem; }
  .top-card-detail-inner { padding: 0 12px 12px 44px; }
  .top-card-detail-inner p { font-size: 0.8rem; }
  .top-card-detail-inner .traits span { font-size: 0.68rem; }

  .char-section { padding: 0 8px 30px; margin-top: 20px; }
  .char-section .section-head { margin-bottom: 18px; }
  .char-section .section-head h2 { font-size: 1.1rem; }
  .char-grid { gap: 10px; }
  .char-detail-card .card-expanded-inner { padding: 0 10px 12px; }
  .char-detail-card .card-expanded-inner .info-row { font-size: 0.75rem; }
}

@media (max-width: 380px) {
  header { padding: 8px 12px; }
  .wordmark { font-size: 0.95rem; }
  header nav a { font-size: 0.75rem; padding: 4px 10px; }

  .quiz-container { padding: 14px 10px 14px; }
  #screen-intro h1 { font-size: 1.15rem; }
  .q-text { font-size: 0.92rem; }
  .option { padding: 9px 10px; font-size: 0.82rem; gap: 8px; }

  .char-grid { grid-template-columns: 1fr; }
  .char-detail-card .card-collapsed { padding: 10px; gap: 8px; }
  .char-detail-card .card-avatar { width: 42px; height: 42px; }
  .char-detail-card .card-name { font-size: 0.9rem; }
  .char-detail-card .card-mbti { font-size: 0.6rem; padding: 2px 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header>
  <a href="#" class="wordmark">ちいかわ<span>.</span></a>

// STATE
let currentQ = 0, scores = {}, answers = [];

function initScores(){
  scores={}; CHAR_KEYS.forEach(k=>scores[k]=0);
}

function startQuiz(){
  initScores(); currentQ=0; answers=[];
  showScreen('screen-quiz'); renderQuestion();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQuestion(){
  const q = QQ[currentQ];
  const area = document.getElementById('questionArea');
  const filled = answers[currentQ];
  let html = `
    <div class="q-number">问题 ${currentQ+1} / ${TOTAL_Q}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
  `;
  q.o.forEach((opt,i)=>{
    const sel = filled===i?' selected':'';
    html += `<div class="option${sel}" onclick="selectOption(${i})">
      <div class="radio"></div><span>${opt.t}</span>
    </div>`;
  });
  html += `</div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-back${currentQ>0?' show':''}" onclick="prevQuestion()">← 上一题</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${filled===undefined?'disabled':''}>${currentQ===TOTAL_Q-1?'查看结果 ✨':'下一题 →'}</button>
    </div>
    <div class="question-progress-text">${currentQ+1} / ${TOTAL_Q}</div>`;
  area.innerHTML = html;
  document.getElementById('progressFill').style.width = `${((currentQ+1)/TOTAL_Q)*100}%`;
  document.getElementById('progressLabel').textContent = `${currentQ+1} / ${TOTAL_Q}`;
}

function selectOption(idx){
  answers[currentQ]=idx;
  renderQuestion();
  if(currentQ < TOTAL_Q-1) setTimeout(()=>nextQuestion(), 350);
}

function nextQuestion(){
  if(answers[currentQ]===undefined) return;
  const opt = QQ[currentQ].o[answers[currentQ]];
  if(opt.s) for(let k in opt.s) scores[k]=(scores[k]||0)+opt.s[k];
  if(currentQ===TOTAL_Q-1) showResult();
  else { currentQ++; renderQuestion(); }
}

function prevQuestion(){
  if(currentQ===0) return;
  currentQ--; renderQuestion();
}

function showResult(){
  showScreen('screen-result');
  const area = document.getElementById('resultArea');
  // Calc percentages
  let maxScore = 0;
  CHAR_KEYS.forEach(k=>{if(scores[k]>maxScore)maxScore=scores[k];});
  const rankings = CHAR_KEYS.map(k=>({key:k, score:scores[k], pct: maxScore>0 ? Math.round(scores[k]/maxScore*100) : 0})).sort((a,b)=>b.score-a.score);
  const top3 = rankings.slice(0,3);
  const ch1 = CHARS[top3[0].key];
  const pct1 = top3[0].pct;

  let html = `<div class="top1-wrap">
    <div class="top1-avatar"><img src="${ch1.img}" alt="${ch1.name}"></div>
    <div class="top1-info">
      <span class="rank-label">✨ TOP 1</span>
      <h3>${ch1.name}</h3>
      <div class="jp-name">${ch1.jp}</div>
      <div class="match-bar">
        <div class="bar-track"><div class="bar-fill" style="width:${pct1}%"></div></div>
        <span class="pct">${pct1}%</span>
      </div>
      <div class="type-tag">${ch1.type}</div>
      <div class="desc">${ch1.desc}</div>
      <div class="traits">${ch1.traits.map(t=>'<span>'+t+'</span>').join('')}</div>
    </div>
    <div class="top1-percent-badge">${pct1}%</div>
  </div>`;

  // TOP2 & TOP3
  html += '<div class="top2-3">';
  for(let i=1; i<top3.length; i++){
    const ch = CHARS[top3[i].key];
    const rankNum = i+1;
    const rankLabel = rankNum===2?'R2':'R3';
    html += `<div class="top-card" onclick="this.classList.toggle('open')">
      <div class="top-card-header">
        <div class="rank-badge ${rankLabel}">${rankNum}</div>
        <div class="mini-avatar"><img src="${ch.img}" alt="${ch.name}"></div>
        <div class="card-name">${ch.name}</div>
        <div class="card-pct">${top3[i].pct}%</div>
        <div class="expand-icon">▼</div>
      </div>
      <div class="top-card-detail">
        <div class="top-card-detail-inner">
          <div class="type-tag">${ch.type}</div>
          <div class="jp-name" style="font-size:0.8rem;color:var(--ink-lighter);margin-bottom:6px">${ch.jp}</div>
          <p>${ch.desc}</p>
          <div class="traits">${ch.traits.map(t=>'<span>'+t+'</span>').join('')}</div>
        </div>
      </div>
    </div>`;
  }
  html += '</div>';
  html += `<div class="restart-row"><button class="btn btn-secondary" onclick="restartQuiz()">再测一次 🔄</button></div>`;
  area.innerHTML = html;
}

function restartQuiz(){
  showScreen('screen-intro');
}

function renderCharCards(){
  const grid = document.getElementById('charGrid');
  let html = '';
  CHAR_DETAILS.forEach((ch, idx) => {
    html += `
    <div class="char-detail-card" id="card-${ch.key}" onclick="toggleCard('${ch.key}')">
      <div class="card-collapsed">
        <div class="card-avatar"><img src="${ch.img}" alt="${ch.name}" loading="lazy"></div>
        <div class="card-main">
          <div class="card-name">${ch.name}</div>
          <div class="card-name-jp">${ch.jp}</div>
          <div class="card-mbti">${ch.mbti}</div>
        </div>
        <span class="card-expand-icon">▼</span>
      </div>
      <div class="card-expanded">
        <div class="card-expanded-inner">
          <p class="card-desc">${ch.desc}</p>
          <div class="info-rows">
            ${ch.info.map(i => `<div class="info-row"><span class="info-label">${i.label}</span><span class="info-value">${i.value}</span></div>`).join('')}
          </div>
          <div class="voice-box">${ch.voice}</div>
          <div class="card-traits">${ch.traits.map(t => `<span>${t}</span>`).join('')}</div>
        </div>
      </div>
    </div>`;
  });
  grid.innerHTML = html;
}

function toggleCard(key){
  const card = document.getElementById('card-' + key);
  if (!card) return;
  // Close all other open cards
  document.querySelectorAll('.char-detail-card.open').forEach(c => {
    if (c !== card) c.classList.remove('open');
  });
  card.classList.toggle('open');
}

// Render cards on page load
renderCharCards();
