<style>
:root {
  --pink: oklch(72% 0.18 355);
  --pink-light: oklch(88% 0.08 355);
  --pink-pale: oklch(95% 0.04 355);
  --cream: oklch(97% 0.015 85);
  --cream-2: oklch(93% 0.02 85);
  --cream-3: oklch(88% 0.025 85);
  --gold: oklch(82% 0.16 90);
  --gold-dark: oklch(65% 0.14 85);
  --red: oklch(62% 0.22 25);
  --ink: oklch(22% 0.012 50);
  --ink-light: oklch(40% 0.01 50);
  --ink-lighter: oklch(55% 0.008 50);
  --radius: 20px;
  --radius-sm: 14px;
  --radius-pill: 999px;
  --shadow: 0 4px 20px oklch(22% 0.012 50 / 0.06);
  --shadow-lg: 0 12px 40px oklch(22% 0.012 50 / 0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; scroll-behavior: smooth; }
body {
  overflow-x: clip;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--cream);
  min-height: 100dvh;
}
body::before {
  content: ""; position: fixed; top: -200px; right: -150px; width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(95% 0.04 355 / 0.5), transparent);
  pointer-events: none; z-index: 0;
}
body::after {
  content: ""; position: fixed; bottom: -120px; left: -100px; width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(94% 0.06 90 / 0.35), transparent);
  pointer-events: none; z-index: 0;
}

/* ── Header ── */
header {
  position: relative; z-index: 10;
  padding: 14px 24px; max-width: 820px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
}
.wordmark {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.2rem;
  color: var(--ink); letter-spacing: -0.03em; text-decoration: none;
}
.wordmark span { color: var(--pink); }
header nav { display: flex; gap: 12px; align-items: center; }
header nav a {
  font-size: 0.85rem; font-weight: 500; color: var(--ink-light); text-decoration: none;
  padding: 6px 12px; border-radius: var(--radius-pill);
  transition: all 0.2s ease;
}
header nav a:hover { color: var(--pink); background: var(--pink-pale); }

/* ── Main ── */
main {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 24px 50px;
}

/* ── Omikuji Container ── */
.omikuji-container {
  width: 100%; max-width: 560px;
  background: white; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 32px 28px 28px; text-align: center;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative; overflow: hidden;
}

/* ── Screen management ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── INTRO SCREEN ── */
.omikuji-intro { padding: 10px 0 0; }
.omikuji-intro .intro-icon {
  font-size: 3.5rem; margin-bottom: 10px;
  animation: float 3s ease-in-out infinite;
}
.omikuji-intro h1 {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
  font-size: 1.7rem; letter-spacing: -0.03em; margin-bottom: 6px;
}
.omikuji-intro h1 span { color: var(--pink); }
.omikuji-intro .sub {
  font-size: 0.9rem; color: var(--ink-light); margin-bottom: 6px; line-height: 1.7;
}
.omikuji-intro .sub2 {
  font-size: 0.8rem; color: var(--ink-lighter); margin-bottom: 22px;
}
.omikuji-intro .date-display {
  font-family: 'Noto Serif JP', 'Plus Jakarta Sans', serif;
  font-size: 0.85rem; color: var(--ink-lighter); margin-bottom: 16px;
}

.btn {
  padding: 14px 40px; border-radius: var(--radius-pill);
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
  font-size: 1rem; border: none; cursor: pointer;
  transition: all 0.2s ease; text-decoration: none; display: inline-block;
}
.btn-primary {
  background: linear-gradient(135deg, var(--pink), oklch(68% 0.2 20));
  color: white; box-shadow: 0 4px 16px oklch(72% 0.18 355 / 0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px oklch(72% 0.18 355 / 0.45); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary { background: var(--cream-2); color: var(--ink-light); }
.btn-secondary:hover { background: var(--cream-3); }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* ── DRAW SCREEN ── */
#screen-draw { padding: 10px 0 0; }
.draw-prompt {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
  font-size: 1.15rem; margin-bottom: 20px; color: var(--ink);
}
.draw-stage {
  width: 140px; height: 140px; border-radius: 50%; overflow: hidden;
  margin: 0 auto 12px;
  background: var(--cream-2);
  box-shadow: 0 4px 20px oklch(22% 0.012 50 / 0.08);
  position: relative;
}
.draw-stage img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transform: scale(0.5);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.draw-stage img.revealed {
  opacity: 1; transform: scale(1);
}
.draw-hint {
  font-size: 0.82rem; color: var(--ink-lighter); margin-top: 4px;
}
.draw-shake {
  animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-8px) rotate(-3deg); }
  20% { transform: translateX(8px) rotate(3deg); }
  30% { transform: translateX(-10px) rotate(-2deg); }
  40% { transform: translateX(10px) rotate(2deg); }
  50% { transform: translateX(-6px) rotate(-1deg); }
  60% { transform: translateX(6px) rotate(1deg); }
  70% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
  90% { transform: translateX(-2px); }
}

/* ── RESULT SCREEN ── */
#screen-result { padding: 0; }
.result-char {
  width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
  margin: 0 auto 10px;
  background: var(--cream-2);
  box-shadow: 0 6px 24px oklch(22% 0.012 50 / 0.12);
  animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.result-char img { width: 100%; height: 100%; object-fit: cover; }
@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.result-char-name {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
  font-size: 1rem; margin-bottom: 8px; color: var(--ink);
}

/* ── Fortune Badge ── */
.fortune-badge {
  display: inline-block;
  padding: 16px 40px; border-radius: var(--radius-pill);
  font-family: 'Noto Serif JP', 'Plus Jakarta Sans', serif;
  font-weight: 700; font-size: 2rem;
  letter-spacing: 0.08em; margin-bottom: 6px;
  animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
}
@keyframes badgePop {
  0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.fortune-badge.daikichi { background: oklch(95% 0.06 85); color: var(--red); box-shadow: 0 4px 16px oklch(82% 0.16 90 / 0.5); }
.fortune-badge.chukichi { background: oklch(95% 0.04 85); color: oklch(55% 0.14 70); box-shadow: 0 4px 12px oklch(80% 0.14 90 / 0.3); }
.fortune-badge.shokichi { background: oklch(94% 0.04 200 / 0.4); color: oklch(55% 0.14 240); box-shadow: 0 4px 12px oklch(72% 0.12 240 / 0.25); }
.fortune-badge.kichi   { background: oklch(94% 0.04 150 / 0.4); color: oklch(50% 0.12 160); box-shadow: 0 4px 12px oklch(70% 0.12 160 / 0.25); }
.fortune-badge.suekichi{ background: oklch(94% 0.02 50 / 0.3); color: oklch(45% 0.05 70); box-shadow: 0 4px 10px oklch(60% 0.03 70 / 0.2); }

.fortune-message {
  font-size: 0.85rem; color: var(--ink-lighter); margin-bottom: 18px;
}

/* ── Detail Cards ── */
.fortune-details {
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  margin-bottom: 22px;

.fortune-detail-row {

.fortune-detail-row .fd-icon {

.fortune-detail-row .fd-label {

}
.fortune-detail-row .fd-value {

/* lucky extras bar */
.lucky-extras {

}
.lucky-extra {

.lucky-extra.item { background: oklch(94% 0.04 355 / 0.5); color: var(--pink); }
.lucky-extra.color { background: oklch(94% 0.06 260 / 0.3); color: oklch(50% 0.12 250); }
.lucky-extra.number { background: oklch(94% 0.06 140 / 0.3); color: oklch(50% 0.12 150); }
.lucky-extra.direction { background: oklch(94% 0.05 60 / 0.3); color: oklch(55% 0.12 70); }

/* ── Redraw button ── */
.redraw-row { margin-top: 2px; }

/* ── Bottom note ── */
.omikuji-note {
  text-align: center; margin-top: 20px;
  font-size: 0.75rem; color: var(--ink-lighter); max-width: 560px;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  header { padding: 10px 16px; }

  main { padding: 14px 12px 36px; }

@media (max-width: 480px) {

@media ( prefers-reduced-motion: reduce ) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

function showScreen(id) {
  document.querySelectorAll('#omikujiContainer .screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

  const d = now.getDate();

// ═══════════════════════════════
//  WEIGHTED RANDOM PICK
// ═══════════════════════════════
function weightedPick(list) {
  const total = list.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const item of list) {
    r -= item.weight;
    if (r <= 0) return item;
  }
  return list[list.length - 1];
}

function startDraw() {
  showScreen('screen-draw');

  const char = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
  const fortune = weightedPick(FORTUNE_WEIGHTS);
  const stage = document.getElementById('drawStage');
  const img   = document.getElementById('drawImg');
  const hint  = document.getElementById('drawHint');
  const prompt= document.getElementById('drawPrompt');

  // Reset
  img.classList.remove('revealed');
  img.src = char.img;
  hint.textContent = '';
  prompt.textContent = '正在感应你的运势…';
  stage.classList.remove('draw-shake');

  // Phase 1: shake
  setTimeout(() => {
    stage.classList.add('draw-shake');
    prompt.textContent = '唔…感觉到了什么！';
  }, 300);

  // Phase 2: flash characters
  let flashCount = 0;
  const flashInterval = setInterval(() => {
    const randomChar = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
    img.src = randomChar.img;
    img.classList.add('revealed');
    flashCount++;
    if (flashCount >= 5) {
      clearInterval(flashInterval);
      // Phase 3: settle on final character
      img.src = char.img;
      img.classList.add('revealed');
      stage.classList.remove('draw-shake');
      prompt.textContent = '就是你了！';
      hint.textContent = char.name + '（' + char.jp + '）';

      // Phase 4: show result
      setTimeout(() => {
        showResult(char, fortune);
      }, 1200);
    }
  }, 250);
}

// ═══════════════════════════════
//  SHOW RESULT
// ═══════════════════════════════
function showResult(char, fortune) {
  showScreen('screen-result');
  const msg = FORTUNE_MSGS[fortune.key];
  const pick = msg[Math.floor(Math.random() * msg.length)];
  const det = makeDetails(fortune.key);

  const html = `
    <div class="result-char">
      <img src="${char.img}" alt="${char.name}">
    </div>
    <div class="result-char-name">${char.name} 送来的运势</div>
    <div class="fortune-badge ${fortune.key}">${fortune.level}</div>
    <div class="fortune-message">${fortune.star}</div>

    <p style="font-size:0.9rem;color:var(--ink-light);line-height:1.7;margin-bottom:14px;max-width:420px;margin-left:auto;margin-right:auto;">
      ${pick}
    </p>

    <div class="fortune-details">
      <div class="fortune-detail-row">
        <span class="fd-icon">💕</span>
        <span class="fd-label">恋爱运</span>
        <span class="fd-value">${det.love}</span>
      </div>
      <div class="fortune-detail-row">
        <span class="fd-icon">💼</span>
        <span class="fd-label">工作运</span>
        <span class="fd-value">${det.work}</span>
      </div>
      <div class="fortune-detail-row">
        <span class="fd-icon">🩺</span>
        <span class="fd-label">健康运</span>
        <span class="fd-value">${det.health}</span>
      </div>
    </div>

    <div class="lucky-extras">
      <span class="lucky-extra item">🎁 幸运物：${det.luckyItem}</span>
      <span class="lucky-extra color">🎨 幸运色：${det.luckyColor}</span>
      <span class="lucky-extra number">🔢 幸运数字：${det.luckyNumber}</span>
      <span class="lucky-extra direction">🧭 幸运方位：${det.direction}</span>
    </div>

    <div class="redraw-row">
      <button class="btn btn-secondary" onclick="startDraw()">🔄 再抽一次</button>
    </div>
  `;

  document.getElementById('resultContent').innerHTML = html;
}
</script>
