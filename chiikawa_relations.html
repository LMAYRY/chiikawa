<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちいかわ · 角色关系图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --pink: oklch(72% 0.18 355);
  --pink-light: oklch(88% 0.08 355);
  --pink-pale: oklch(95% 0.04 355);
  --cream: oklch(97% 0.015 85);
  --cream-2: oklch(93% 0.02 85);
  --cream-3: oklch(88% 0.025 85);
  --ink: oklch(22% 0.012 50);
  --ink-light: oklch(40% 0.01 50);
  --ink-lighter: oklch(55% 0.008 50);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --shadow: 0 4px 20px oklch(22% 0.012 50 / 0.06);
  --shadow-lg: 0 12px 40px oklch(22% 0.012 50 / 0.12);
  --edge-best:#e88a9a;
  --edge-friend:#60b8a0;
  --edge-mentor:#e0b050;
  --edge-mystery:#9870c0;
  --edge-trio:#6098d0;
  --edge-colleague:#60a888;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow:hidden;height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.65;
  color:var(--ink);background:var(--cream);height:100dvh;overflow:hidden;
}
body::before{
  content:"";position:fixed;top:-200px;right:-150px;width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle,oklch(95% 0.04 355 / 0.4),transparent);
  pointer-events:none;z-index:0;
}
body::after{
  content:"";position:fixed;bottom:-120px;left:-100px;width:400px;height:400px;
  border-radius:50%;
  background:radial-gradient(circle,oklch(94% 0.06 90 / 0.3),transparent);
  pointer-events:none;z-index:0;
}

/* ── Header ── */
header{
  position:relative;z-index:40;padding:12px 18px;max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
}
.wordmark{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.1rem;
  color:var(--ink);letter-spacing:-0.03em;text-decoration:none;
}
.wordmark span{color:var(--pink)}
header nav{display:flex;gap:8px;align-items:center}
header nav a{
  font-size:0.78rem;font-weight:500;color:var(--ink-light);text-decoration:none;
  padding:5px 10px;border-radius:var(--radius-pill);transition:all 0.2s ease;
}
header nav a:hover{color:var(--pink);background:var(--pink-pale)}

/* ── Graph Viewport ── */
.viewport{
  position:fixed;top:56px;left:0;right:0;bottom:0;z-index:10;
  cursor:grab;overflow:hidden;
}
.viewport:active,.viewport.panning{cursor:grabbing}

/* ── Edge SVG Layer ── */
.edge-svg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:1;
}
.edge-svg line{stroke-width:2.5;stroke-linecap:round;transition:all 0.3s ease;cursor:pointer}
.edge-svg line.type-best{stroke:var(--edge-best)}
.edge-svg line.type-friend{stroke:var(--edge-friend)}
.edge-svg line.type-mentor{stroke:var(--edge-mentor)}
.edge-svg line.type-mystery{stroke:var(--edge-mystery)}
.edge-svg line.type-trio{stroke:var(--edge-trio)}
.edge-svg line.type-colleague{stroke:var(--edge-colleague)}

.edge-svg line.highlighted{stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}
.edge-svg line.dimmed{opacity:0.1}

/* ── Nodes Layer ── */
.nodes-layer{
  position:absolute;top:0;left:0;width:0;height:0;z-index:2;
}

.node-card{
  position:absolute;width:80px;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:opacity 0.3s ease,filter 0.3s ease;
  transform:translate(-50%,-50%);
}
.node-card:hover{filter:brightness(1.1)}
.node-card.highlight{filter:drop-shadow(0 0 10px var(--pink));z-index:5}
.node-card.dim{opacity:0.25;pointer-events:none}

.node-avatar{
  width:68px;height:68px;border-radius:50%;overflow:hidden;
  background:var(--cream-2);
  border:3px solid #ccc;
  box-shadow:0 4px 12px oklch(22% 0.012 50 / 0.1);
  transition:border-color 0.3s ease;
}
.node-avatar img{width:100%;height:100%;object-fit:cover}
.node-name{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
  font-size:12px;color:var(--ink);margin-top:4px;text-align:center;
  text-shadow:0 0 6px white,0 0 6px white;
  white-space:nowrap;
}
.node-jp{
  font-size:9px;color:var(--ink-lighter);text-align:center;
  text-shadow:0 0 4px white,0 0 4px white;
  white-space:nowrap;
}

/* ── Info Panel ── */
.info-panel{
  position:fixed;right:16px;top:68px;bottom:16px;z-index:50;
  width:min(380px,92vw);background:white;border-radius:var(--radius);
  box-shadow:var(--shadow-lg);overflow-y:auto;
  transform:translateX(calc(100% + 20px));
  transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);
  display:flex;flex-direction:column;
}
.info-panel.open{transform:translateX(0)}

.panel-header{
  display:flex;align-items:center;gap:14px;padding:20px;
  border-bottom:1px solid var(--cream-3);
  position:sticky;top:0;background:white;z-index:2;
}
.panel-avatar{
  width:56px;height:56px;border-radius:50%;overflow:hidden;
  background:var(--cream-2);flex-shrink:0;
  box-shadow:0 2px 10px oklch(22% 0.012 50 / 0.08);
}
.panel-avatar img{width:100%;height:100%;object-fit:cover}
.panel-info{flex:1;min-width:0}
.panel-info .pname{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;
  font-size:1.05rem;letter-spacing:-0.02em;
}
.panel-info .pjp{font-size:0.76rem;color:var(--ink-lighter)}
.panel-close{
  width:32px;height:32px;border-radius:50%;border:none;
  background:var(--cream-2);color:var(--ink-light);
  font-size:1rem;cursor:pointer;display:grid;place-items:center;
  flex-shrink:0;transition:all 0.2s ease;
}
.panel-close:hover{background:var(--cream-3);color:var(--ink)}

.panel-body{padding:16px 20px 20px;flex:1}
.panel-body .desc{font-size:0.85rem;color:var(--ink-light);line-height:1.7;margin-bottom:16px}
.panel-body .section-title{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
  font-size:0.8rem;color:var(--ink);margin-bottom:10px;letter-spacing:-0.01em;
}

.rel-list{display:flex;flex-direction:column;gap:6px}
.rel-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:var(--radius-sm);
  background:var(--cream);cursor:pointer;border:2px solid transparent;
  transition:all 0.2s ease;
}
.rel-item:hover{background:white;border-color:var(--pink-light)}
.rel-item .ravatar{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:var(--cream-2);flex-shrink:0;
}
.rel-item .ravatar img{width:100%;height:100%;object-fit:cover}
.rel-item .rinfo{flex:1;min-width:0}
.rel-item .rname{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
  font-size:0.85rem;line-height:1.2;
}
.rel-item .rtag{
  display:inline-block;font-size:0.62rem;font-weight:600;
  padding:1px 8px;border-radius:var(--radius-pill);letter-spacing:0.03em;margin-top:2px;
}
.rel-item .rdetail{font-size:0.75rem;color:var(--ink-lighter);margin-top:2px;line-height:1.45}
.rel-item .rarrow{color:var(--ink-lighter);font-size:0.8rem;flex-shrink:0}

.tag-best{background:oklch(93% 0.06 355);color:var(--pink)}
.tag-friend{background:oklch(93% 0.06 180);color:oklch(50% 0.12 170)}
.tag-mentor{background:oklch(93% 0.06 70);color:oklch(52% 0.11 70)}
.tag-mystery{background:oklch(93% 0.05 300);color:oklch(45% 0.10 300)}
.tag-trio{background:oklch(93% 0.05 240);color:oklch(48% 0.11 250)}
.tag-colleague{background:oklch(93% 0.05 150);color:oklch(45% 0.10 160)}

/* ── Legend ── */
.legend{
  position:fixed;left:12px;bottom:12px;z-index:30;
  background:white;border-radius:var(--radius-sm);padding:10px 14px;
  box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:0.68rem;color:var(--ink-light)}
.legend-line{width:14px;height:3px;border-radius:2px;flex-shrink:0}

@media(max-width:768px){
  header{padding:8px 12px}
  .wordmark{font-size:0.9rem}
  header nav a{font-size:0.7rem;padding:4px 7px}
  .viewport{top:44px}
  .info-panel{right:8px;top:52px;bottom:8px;width:min(320px,94vw)}
  .legend{left:6px;bottom:6px;gap:6px;padding:8px 10px}
  .legend-item{font-size:0.62rem}
}
@media(max-width:480px){
  header nav{gap:3px}
  header nav a{font-size:0.62rem;padding:3px 5px}
  .info-panel{right:4px;top:46px;bottom:4px;width:calc(100vw - 8px);border-radius:var(--radius-sm)}
  .panel-header{padding:14px}
  .panel-avatar{width:46px;height:46px}
  .panel-body{padding:12px 14px 16px}
  .panel-body .desc{font-size:0.78rem}
  .rel-item{padding:8px 10px;gap:8px}
  .rel-item .ravatar{width:32px;height:32px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}
</style>
</head>

<script>
// ════════════════════ DATA ════════════════════
const CHARS = {
  chiikawa:{id:'chiikawa',name:'吉伊卡哇',jp:'ちいかわ',mbti:'INFP',color:'#f4c0c8',
    img:'https://static.wikia.nocookie.net/chiikawa/images/2/2c/AdorableCutieChiikawa.png',
    desc:'主角。白色小仓鼠，胆小爱哭但内心勇敢。幸运体质，抽奖王。虽然考试运差，但为了朋友可以变得非常坚强。'},
  hachiware:{id:'hachiware',name:'小八',jp:'ハチワレ',mbti:'ENFP',color:'#a0c8ee',
    img:'https://static.wikia.nocookie.net/chiikawa/images/6/61/SweetBabyHachiware2.png',
    desc:'蓝白猫猫，三人组中唯一会说话的角色，担任翻译官。乐观开朗，爱弹吉他唱歌，片尾曲就是他唱的！'},
  usagi:{id:'usagi',name:'乌萨奇',jp:'うさぎ',mbti:'ESTP',color:'#f8e088',
    img:'https://static.wikia.nocookie.net/chiikawa/images/4/43/YahaUsagi.png',
    desc:'精力充沛的兔子，整天怪叫。战斗力最高，神出鬼没，没人知道它住哪。但关键时刻非常可靠。'},
  rakko:{id:'rakko',name:'海獺勇者',jp:'ラッコ',mbti:'ISTJ',color:'#8cc8a8',
    img:'https://static.wikia.nocookie.net/chiikawa/images/6/63/FightOnRakko.png',
    desc:'讨伐榜 No.1 的传奇勇者！吉伊和小八的师傅。实力超群但性格慷慨，反差萌是超爱吃甜食。'},
  momonga:{id:'momonga',name:'小桃',jp:'モモンガ',mbti:'ESFP',color:'#cca8e8',
    img:'https://static.wikia.nocookie.net/chiikawa/images/a/a0/Momonga.png',
    desc:'飞鼠。任性骄纵，超级喜欢装可爱求夸奖。和古本是好朋友。有个"灵魂交换"都市传说。'},
  kurimanju:{id:'kurimanju',name:'栗子馒头',jp:'くりまんじゅう',mbti:'ISTP',color:'#e8c888',
    img:'https://static.wikia.nocookie.net/chiikawa/images/9/93/TastyKurimanju.png',
    desc:'蜜獾。话不多但沉稳可靠，爱喝酒吃零食，考取了饮酒证照。像大家的可靠大哥。'},
  shisa:{id:'shisa',name:'狮萨',jp:'シーサー',mbti:'ISFJ',color:'#f0d480',
    img:'https://static.wikia.nocookie.net/chiikawa/images/1/12/RamenPleaseShisa.png',
    desc:'以冲绳风狮爷为原型的角色。拉面店「郎」店员，认真热血。目标是考饮酒证和师傅喝酒。'},
  kani:{id:'kani',name:'古本',jp:'カニ',mbti:'INFJ',color:'#f4c8c8',
    img:'https://static.wikia.nocookie.net/chiikawa/images/7/76/Kani-removebg-preview_%281%29.png',
    desc:'粉色螃蟹，经营二手书店。温柔善良，热爱阅读。和小桃是好朋友，头上螃蟹头带是小桃送的。'},
  armor:{id:'armor',name:'手工铠甲',jp:'手作り鎧',mbti:'ENFJ',color:'#a0d8b8',
    img:'https://static.wikia.nocookie.net/chiikawa/images/9/96/YoroiSansTransparent.png',
    desc:'盔甲人族群中最温柔的一位。热爱手工制作，会缝制睡衣，性格温柔体贴。'},
  anoko:{id:'anoko',name:'那孩子',jp:'あのこ',mbti:'INTJ',color:'#c8b0e0',
    img:'https://static.wikia.nocookie.net/chiikawa/images/b/ba/Anoko1.png',
    desc:'毛茸茸巨大怪物，疑似吉伊的前同事。充满谜团，似乎还保留着过去的记忆。'},
  ramen:{id:'ramen',name:'拉面铠甲',jp:'ラーメン鎧',mbti:'ISTJ',color:'#98b8d8',
    img:'https://static.wikia.nocookie.net/chiikawa/images/9/96/YoroiSansTransparent.png',
    desc:'在拉面店「郎」担任主厨的盔甲人。话少但手艺一流。狮萨的师傅。'},
  labor:{id:'labor',name:'劳动铠甲',jp:'労働鎧',mbti:'ESTJ',color:'#d8c488',
    img:'https://static.wikia.nocookie.net/chiikawa/images/9/96/YoroiSansTransparent.png',
    desc:'负责分发除草和讨伐工作的盔甲人。是盔甲人族群中负责管理的角色。'}
};

const RELS = [
  {from:'chiikawa',to:'hachiware',type:'best',label:'挚友',detail:'最亲密的伙伴。小八是吉伊的翻译官，能替吉伊说出心里话。两人经常一起行动、互相鼓励。'},
  {from:'chiikawa',to:'usagi',type:'trio',label:'三人组',detail:'吉伊和乌萨奇都依赖小八翻译。乌萨奇虽然爱捉弄吉伊，但在危险时会第一个冲上去保护大家。'},
  {from:'hachiware',to:'usagi',type:'trio',label:'三人组',detail:'小八能理解乌萨奇的怪叫并帮大家翻译。两人一猫一兔，性格互补，是Chiikawa世界的灵魂三人组。'},
  {from:'chiikawa',to:'rakko',type:'mentor',label:'师徒',detail:'海獺勇者是吉伊和小八的讨伐师傅。吉伊非常崇拜他，海獺也常常关照这两位后辈。'},
  {from:'hachiware',to:'rakko',type:'mentor',label:'师徒',detail:'小八也和海獺勇者建立了深厚的师徒情谊，经常一起吃饭、分享战斗经验。'},
  {from:'chiikawa',to:'anoko',type:'mystery',label:'神秘联系',detail:'据推测那孩子是吉伊在工厂时的前同事。它对吉伊似乎有特殊反应，真实身份充满谜团。'},
  {from:'momonga',to:'kani',type:'friend',label:'好友',detail:'小桃和古本是好朋友。尽管小桃性格任性，古本总是包容它。古本头上的螃蟹头带也是小桃送的。'},
  {from:'shisa',to:'ramen',type:'mentor',label:'师徒',detail:'狮萨在拉面店「郎」当学徒，十分敬仰主厨拉面铠甲。梦想是考取饮酒证后和师傅一起喝酒。'},
  {from:'armor',to:'ramen',type:'colleague',label:'同族',detail:'手工铠甲和拉面铠甲同属盔甲人族群。他们是同事关系，共同维持着Chiikawa世界的运转。'},
  {from:'armor',to:'labor',type:'colleague',label:'同族',detail:'劳动铠甲负责分发工作，手工铠甲则制作各种手工品。他们是分工不同的同事。'},
  {from:'chiikawa',to:'momonga',type:'friend',label:'认识',detail:'小桃偶尔也会和主角三人组一起出现，虽然它更常和古本待在一起。'},
  {from:'kurimanju',to:'chiikawa',type:'friend',label:'关照',detail:'栗子馒头前辈像大哥一样关照这些小可爱们，尤其是吉伊这个胆小的后辈。'},
  {from:'kurimanju',to:'hachiware',type:'friend',label:'关照',detail:'栗子馒头前辈也常常关照小八，两人性格都比较开朗，能聊得来。'},
  {from:'kurimanju',to:'usagi',type:'friend',label:'关照',detail:'栗子馒头前辈对乌萨奇的怪叫和捣蛋总是淡然一笑，以大哥的姿态包容。'},
  {from:'armor',to:'chiikawa',type:'friend',label:'朋友',detail:'手工铠甲性格温柔，和小可爱们关系都很好。他的手工制品很受大家欢迎。'}
];

// ════════════════ LAYOUT ════════════════
const BASE = {
  chiikawa:  {x:580, y:360},
  hachiware: {x:430, y:280},
  usagi:    {x:430, y:440},
  rakko:    {x:730, y:360},
  momonga:  {x:320, y:200},
  kani:     {x:280, y:340},
  shisa:    {x:750, y:230},
  kurimanju:{x:610, y:520},
  armor:    {x:330, y:480},
  anoko:    {x:560, y:580},
  ramen:    {x:880, y:260},
  labor:    {x:200, y:400}
};

const NODE_R = 34;

// ════════════════ STATE ════════════════
const viewport = document.getElementById('viewport');
const nodesLayer = document.getElementById('nodesLayer');
const edgeSvg = document.getElementById('edgeSvg');
const panel = document.getElementById('infoPanel');

let scale = 1, panX = 0, panY = 0, selectedNode = null;
let panning = false, panStart = {x:0,y:0}, origPan = {x:0,y:0};
const pos = {}; // mutable positions
Object.keys(BASE).forEach(k => pos[k] = {x:BASE[k].x, y:BASE[k].y});

function px(x){return x*scale + panX}
function py(y){return y*scale + panY}

// ════════════════ RENDER ════════════════
function render() {
  // ── EDGES (SVG) ──
  let edgeHtml = '';
  RELS.forEach(r => {
    const f = pos[r.from], t = pos[r.to];
    if (!f || !t) return;
    const dx = t.x-f.x, dy = t.y-f.y, dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 1) return;
    const ux = dx/dist, uy = dy/dist;
    const sx = px(f.x + ux*NODE_R), sy = py(f.y + uy*NODE_R);
    const ex = px(t.x - ux*NODE_R), ey = py(t.y - uy*NODE_R);
    edgeHtml += `<line class="edge-line type-${r.type}" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" data-from="${r.from}" data-to="${r.to}" data-label="${r.label}" />`;
  });
  edgeSvg.innerHTML = edgeHtml;

  // ── NODES (CSS positioned divs) ──
  let nodeHtml = '';
  Object.values(CHARS).forEach(ch => {
    const p = pos[ch.id]; if (!p) return;
    const cx = px(p.x), cy = py(p.y);
    nodeHtml += `
    <div class="node-card" data-id="${ch.id}" style="left:${cx}px;top:${cy}px">
      <div class="node-avatar" style="border-color:${ch.color}">
        <img src="${ch.img}" alt="${ch.name}" loading="lazy" />
      </div>
      <div class="node-name">${ch.name}</div>
      <div class="node-jp">${ch.jp}</div>
    </div>`;
  });
  nodesLayer.innerHTML = nodeHtml;

  // bind events
  nodesLayer.querySelectorAll('.node-card').forEach(card => {
    card.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); startDrag(e, card.dataset.id); });
    card.addEventListener('click', e => { e.stopPropagation(); onNodeClick(card.dataset.id); });
  });

  // edge click
  edgeSvg.querySelectorAll('line').forEach(line => {
    line.style.pointerEvents = 'all';
    line.addEventListener('click', e => { e.stopPropagation(); onEdgeClick(line.dataset); });
  });

  // re-apply highlight if a node is selected
  if (selectedNode) highlightNode(selectedNode);
}

// ── DRAG NODE ──
function startDrag(e, id) {
  const p = pos[id]; if (!p) return;
  const sx = e.clientX, sy = e.clientY;
  const ox = p.x, oy = p.y;
  let moved = false;
  function mv(ev) {
    const dx = (ev.clientX-sx)/scale, dy = (ev.clientY-sy)/scale;
    if (Math.abs(dx)>2||Math.abs(dy)>2) moved = true;
    p.x = ox+dx; p.y = oy+dy;
    render();
  }
  function up() {
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);
  }
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
}

// ── CLICK ──
function onNodeClick(id) {
  selectedNode = id;
  highlightNode(id);
  openPanel(id);
}
function onEdgeClick(data) {
  const from = data.from, to = data.to;
  if (from && to) { selectedNode = from; highlightNode(from); openPanel(from, to); }
}
function highlightNode(id) {
  nodesLayer.querySelectorAll('.node-card').forEach(c => c.classList.remove('highlight','dim'));
  const card = nodesLayer.querySelector(`.node-card[data-id="${id}"]`);
  if (card) card.classList.add('highlight');

  const connected = new Set([id]);
  RELS.forEach(r => { if(r.from===id) connected.add(r.to); if(r.to===id) connected.add(r.from); });

  nodesLayer.querySelectorAll('.node-card').forEach(c => {
    if (!connected.has(c.dataset.id)) c.classList.add('dim');
  });

  edgeSvg.querySelectorAll('line').forEach(l => {
    l.classList.remove('highlighted','dimmed');
    if (connected.has(l.dataset.from) && connected.has(l.dataset.to)) l.classList.add('highlighted');
    else l.classList.add('dimmed');
  });
}

function clearHighlight() {
  selectedNode = null;
  nodesLayer.querySelectorAll('.node-card').forEach(c => c.classList.remove('highlight','dim'));
  edgeSvg.querySelectorAll('line').forEach(l => l.classList.remove('highlighted','dimmed'));
}

// ════════════════ INFO PANEL ════════════════
function openPanel(charId, focusTo) {
  const ch = CHARS[charId]; if (!ch) return;
  document.getElementById('panelAvatar').src = ch.img;
  document.getElementById('panelName').textContent = ch.name + ' · ' + ch.mbti;
  document.getElementById('panelJp').textContent = ch.jp;

  const rels = RELS.filter(r => r.from===charId || r.to===charId);
  let sorted = [...rels];
  if (focusTo) sorted.sort((a,b) => {
    const am = (a.from===charId&&a.to===focusTo)||(a.to===charId&&a.from===focusTo);
    const bm = (b.from===charId&&b.to===focusTo)||(b.to===charId&&b.from===focusTo);
    return am?-1:bm?1:0;
  });

  let body = `<p class="desc">${ch.desc}</p>`;
  body += `<div class="section-title">🔗 角色关系（${rels.length}）</div><div class="rel-list">`;

  sorted.forEach(r => {
    const oid = r.from===charId?r.to:r.from;
    const o = CHARS[oid]; if (!o) return;
    body += `
    <div class="rel-item" onclick="navigateTo('${oid}')">
      <div class="ravatar"><img src="${o.img}" alt="${o.name}" loading="lazy"></div>
      <div class="rinfo">
        <div class="rname">${o.name}</div>
        <span class="rtag tag-${r.type}">${r.label}</span>
        <div class="rdetail">${r.detail||''}</div>
      </div>
      <span class="rarrow">→</span>
    </div>`;
  });
  body += '</div>';
  document.getElementById('panelBody').innerHTML = body;
  panel.classList.add('open');
  panel.scrollTop = 0;
}

function navigateTo(id) { selectedNode=id; highlightNode(id); openPanel(id); panel.scrollTop=0; }
function closePanel() { panel.classList.remove('open'); clearHighlight(); }

// ════════════════ VIEWPORT PAN & ZOOM ════════════════
viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.node-card')||e.target.closest('.panel-header')||e.target.closest('.panel-body')) return;
  panning=true; panStart={x:e.clientX,y:e.clientY}; origPan={x:panX,y:panY};
  viewport.classList.add('panning'); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!panning) return;
  panX=origPan.x+(e.clientX-panStart.x); panY=origPan.y+(e.clientY-panStart.y);
  render();
});
document.addEventListener('pointerup', () => { if(panning){panning=false;viewport.classList.remove('panning');} });

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const old=scale;
  scale *= e.deltaY<0?1.08:0.93;
  scale = Math.max(0.3, Math.min(3, scale));
  panX = mx - (mx-panX)*(scale/old);
  panY = my - (my-panY)*(scale/old);
  render();
}, {passive:false});

viewport.addEventListener('dblclick', e => {
  if (e.target.closest('.node-card')) return;
  scale=1;panX=0;panY=0; Object.keys(BASE).forEach(k=>{pos[k].x=BASE[k].x;pos[k].y=BASE[k].y;});
  render(); closePanel();
});

viewport.addEventListener('click', e => {
  if (!e.target.closest('.node-card') && !panning) closePanel();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closePanel(); });

// ════════════════ INIT ════════════════
function recenter() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  const c = BASE.chiikawa;
  panX = w/2 - c.x;
  panY = h/2 - c.y;
  scale = Math.min(w/1250, h/820, 0.9);
  // reset positions
  Object.keys(BASE).forEach(k => { pos[k].x = BASE[k].x; pos[k].y = BASE[k].y; });
  render();
}
window.addEventListener('resize', recenter);
recenter();
</script>
