{q:'你如何看待"命运"？',o:[

{q:'你内心最大的恐惧是什么？',o:[

{q:'如果你死去，最希望留下什么遗产？',o:[

{q:'你领导的方式是？',o:[

{q:'你如何看待痛苦？',o:[

{q:'假设你是一把匕首。你属于？',o:[

{q:'你对过去的错误怎么看？',o:[

{q:'你觉得生命有意义吗？',o:[

{q:'一个恶魔说可以给你最想要的——代价是另一个人的灵魂。你？',o:[

{q:'你希望被别人用什么方式记住？',o:[

{q:'你的自尊心有多强？',o:[
{t:'非常强——你不可以轻视我',s:{laezel:3,astarion:2,minthara:2,raphael:3}},

{q:'你如何对待一个背叛过你的人？',o:[

{t:'一个为自己骄傲的强者——没错，这就是我',s:{laezel:3,minthara:2,raphael:2}},

{q:'在博德之门这样的城市里，你偏向于？',o:[

var NQ=QQ.length;

// ———————————————————————————————
// STATE
// ———————————————————————————————
var cq=0,sc={},an=[];

function clscores(){var o={};CK.forEach(function(k){o[k]=0});return o}
function start(){sc=clscores();cq=0;an=[];show('s1');render()}
function show(id){var els=document.querySelectorAll('.scr');for(var i=0;i<els.length;i++)els[i].classList.remove('on');document.getElementById(id).classList.add('on')}

function render(){
  var q=QQ[cq],area=document.getElementById('qa'),f=an[cq];
  var h='<div class="qn">问题 '+(cq+1)+' / '+NQ+'</div><div class="qt">'+q.q+'</div><div class="ops">';
  q.o.forEach(function(o,i){var s=f===i?' sel':'';h+='<div class="op'+s+'" onclick="pick('+i+')"><div class="rd"></div><span>'+o.t+'</span></div>'});
  h+='</div><div class="btns"><button class="btn btn-bk'+(cq>0?' sh':'')+'" onclick="prev()">← 上一题</button><button class="btn btn-go" id="nb" onclick="nxt()" '+(f===undefined?'disabled':'')+'>'+(cq===NQ-1?'揭晓命运 ✨':'下一题 →')+'</button></div><div class="qp">'+(cq+1)+' / '+NQ+'</div>';
  area.innerHTML=h;
  document.getElementById('pgf').style.width=((cq+1)/NQ*100)+'%';
  document.getElementById('pgt').textContent=(cq+1)+' / '+NQ;
}

function pick(i){an[cq]=i;render();if(cq<NQ-1)setTimeout(function(){nxt()},350)}
function nxt(){
  if(an[cq]===undefined)return;
  var o=QQ[cq].o[an[cq]];
  if(o.s)for(var k in o.s)sc[k]=(sc[k]||0)+o.s[k];
  if(cq===NQ-1)result();else{cq++;render()}
}
function prev(){if(cq===0)return;cq--;render()}

// Theoretical max
var TM={};CK.forEach(function(k){TM[k]=0});
QQ.forEach(function(q){var cm={};q.o.forEach(function(o){if(!o.s)return;for(var k in o.s)cm[k]=Math.max(cm[k]||0,o.s[k])});for(var k in cm)TM[k]+=cm[k]});

function result(){
  show('s2');var area=document.getElementById('ra');
  var rk=CK.map(function(k){return{key:k,score:sc[k],pct:TM[k]>0?Math.round(sc[k]/TM[k]*100):0}}).sort(function(a,b){return b.score-a.score});
  var t3=rk.slice(0,3),c1=CH[t3[0].key],p1=t3[0].pct;
  var h='<div class="t1"><div class="t1-av">'+imgtag(t3[0].key,c1.fb)+'</div><div class="t1-info"><span class="rk">✨ TOP 1</span><h3>'+c1.nm+'</h3><div class="en">'+c1.en+'</div><div class="mb"><div class="bt"><div class="bf" style="width:'+p1+'%"></div></div><span class="pt">'+p1+'%</span></div><div class="cls">'+c1.cl+'</div><div class="dsc">'+c1.ds+'</div><div class="trs">'+c1.tr.map(function(t){return'<span>'+t+'</span>'}).join('')+'</div></div><div class="t1-pct">'+p1+'%</div></div>';
  h+='<div class="t23">';
  for(var i=1;i<t3.length;i++){
    var c=CH[t3[i].key],rn=i+1,rl=rn===2?'R2':'R3';
    h+='<div class="tc" onclick="this.classList.toggle(\'opn\')"><div class="tc-hd"><div class="rkb '+rl+'">'+rn+'</div><div class="ma">'+imgtag(t3[i].key,c.fb)+'</div><div class="cn">'+c.nm+'</div><div class="cp">'+t3[i].pct+'%</div><div class="ei">▼</div></div><div class="tc-dt"><div class="tc-in"><div class="cls">'+c.cl+'</div><div class="en" style="font-size:.8rem;color:var(--ink3);margin-bottom:6px">'+c.en+'</div><p>'+c.ds+'</p><div class="trs">'+c.tr.map(function(t){return'<span>'+t+'</span>'}).join('')+'</div></div></div></div>';
  }
  h+='</div><div class="rr"><button class="btn btn-bk" onclick="reset()">再掷一次骰子 🎲</button></div>';
  area.innerHTML=h;
}
function reset(){show('s0')}

(function renderCards(){

function tog(k){
  var c=document.getElementById('card-'+k);
  if(!c)return;
  var o=document.querySelectorAll('.cdc.opn');
  for(var i=0;i<o.length;i++){if(o[i]!==c)o[i].classList.remove('opn')}
  c.classList.toggle('opn');
}
